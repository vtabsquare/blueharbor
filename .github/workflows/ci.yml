name: BlueHarbor CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Start Supabase Local Stack
      run: |
        supabase init
        supabase start
        echo "SUPABASE_DB_URL=postgresql://postgres:postgres@localhost:54322/postgres" >> $GITHUB_ENV
        echo "SUPABASE_URL=http://localhost:54321" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> $GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd blueharbor-admin-v1/backend
        pip install -r requirements.txt
        pip install cryptography

    - name: Install Admin Node dependencies
      working-directory: ./blueharbor-admin-v1
      run: npm ci

    - name: Install Buyer Node dependencies
      working-directory: ./blueharbor-buyer-portal
      run: npm ci

    - name: Lint Admin (Oxlint)
      working-directory: ./blueharbor-admin-v1
      run: npm run lint

    - name: Lint Buyer (Oxlint)
      working-directory: ./blueharbor-buyer-portal
      run: npm run lint

    - name: Install Playwright Browsers
      working-directory: ./blueharbor-admin-v1
      run: npx playwright install --with-deps chromium

    - name: Run Admin Tests
      working-directory: ./blueharbor-admin-v1
      run: npm test

    - name: Run Buyer Tests
      working-directory: ./blueharbor-buyer-portal
      run: npm test
